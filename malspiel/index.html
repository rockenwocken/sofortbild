  .screen.active { display: flex; }
  h1 { font-size: 2.6rem; font-weight: 900; margin-bottom: 8px; }
  .sub { color: #666; margin-bottom: 40px; }
  .title { font-size: clamp(2.2rem, 11vw, 4rem); letter-spacing: -0.02em; margin-bottom: 48px; word-break: break-all; }
  #settings { width: 100%; max-width: 360px; margin-top: 40px; }
  #settings summary { list-style: none; cursor: pointer; color: #666; font-weight: 700; font-size: 1.05rem; padding: 10px; }
  #settings summary::-webkit-details-marker { display: none; }
  #settings summary::before { content: "⚙︎ "; }
  #settings[open] summary { color: #111; margin-bottom: 20px; }
  .slider-box { width: 100%; max-width: 360px; margin-bottom: 32px; }
  .slider-label { font-size: 1.1rem; margin-bottom: 14px; }
  .slider-label b { font-size: 1.6rem; }
  input[type=range] { width: 100%; height: 36px; accent-color: #111; }
  .scale { display: flex; justify-content: space-between; color: #999; font-size: .85rem; }
  .toggles { display: flex; flex-direction: column; gap: 14px; margin: 0 auto 12px; text-align: left; width: max-content; }
  .toggles label { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 12px; }
  .toggles input { width: 24px; height: 24px; accent-color: #111; }
  .toggles small { color: #999; font-weight: 400; }
  #word.count { font-size: clamp(8rem, 45vw, 18rem); color: #111; }
  button { font: inherit; font-weight: 800; font-size: 1.3rem; padding: 18px 44px;
    border: 3px solid #111; border-radius: 999px; background: #111; color: #fff; cursor: pointer; }
  button.ghost { background: #fff; color: #111; margin-top: 12px; font-size: 1rem; padding: 12px 28px; }
  button:active { transform: scale(.97); }

  #play { position: relative; padding: 16px; }
  #word { font-weight: 900; line-height: 1.05; word-break: break-word; hyphens: auto;
    font-size: clamp(3rem, 16vw, 9rem); }
  #counter { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 0; right: 0;
    color: #bbb; font-weight: 700; font-size: 1rem; }
  #bar { position: absolute; bottom: 0; left: 0; height: 6px; background: #111; width: 0; }
  #stop { position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%); background: none; border: none; color: #ccc;
    font-size: .95rem; font-weight: 600; padding: 8px 16px; }

  #list { list-style: none; counter-reset: n; width: 100%; max-width: 420px;
    margin: 8px 0 32px; text-align: left; columns: 2; column-gap: 24px; }
  #list li { counter-increment: n; font-size: 1.1rem; font-weight: 700; padding: 6px 0;
    border-bottom: 1px solid #eee; break-inside: avoid; }
  #list li { cursor: pointer; transition: color .15s; }
  #list li.done { color: #ccc; text-decoration: line-through; }
  #list li::before { content: counter(n) ". "; color: #bbb; font-weight: 600; }
</style>
</head>

<section id="start" class="screen active">

  <details id="settings">
    <summary>Einstellungen</summary>
    <div class="slider-box">
      <div class="slider-label">Zeit pro Begriff: <b id="secLabel">5</b> Sek.</div>
      <input id="interval" type="range" min="2" max="10" step="1" value="5">
      <div class="scale"><span>2</span><span>10</span></div>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="optOwn" checked> Eigene Begriffe <small>(31)</small></label>
      <label><input type="checkbox" id="optAdult" checked> Ab 18 <small>(30)</small></label>
    </div>
  </details>
</section>

<section id="play" class="screen">
  <div id="counter"></div>
  <div id="word"></div>
  <div id="bar"></div>
  <button id="stop">Abbrechen</button>
</section>

<section id="end" class="screen">
  <h1>Fertig!</h1>

  <ol id="list"></ol>
  <button id="nextBtn">Nächster Spieler</button>

</section>

const OWN = ["Mählissa", "Zitzenradler", "Busen", "Po", "Bolle", "Silvester", "Mallorca", "Schlager", "Disco", "Holger", "Babsi", "Annika", "Christine", "vegan", "Tofu", "Brust", "Foto", "Bayern", "Sophie Blau", "Nacktbaden", "lesbisch", "BH", "Sneaker", "Koks", "Chips", "Hotpot", "Micra", "Berghain", "Techno", "Hitster", "Micra am Mittag"];
const ADULT = ["Kondom", "Dildo", "Vibrator", "Handschellen", "Peitsche", "Strapse", "Tanga", "Reizwäsche", "Latexanzug", "Knutschfleck", "Zungenkuss", "Löffelchen", "Stripperin", "Stripstange", "Liebeskugeln", "Gleitgel", "Penis", "Nippel", "Morgenlatte", "Kussmund", "Lackstiefel", "Hoden", "Sexshop", "Vagina", "Nacktfoto", "Boxershorts", "Missionarsstellung", "One-Night-Stand", "Flitzer", "Pornoheft"];

const ROUND = 16;
const $ = id => document.getElementById(id);
const slider = $("interval");

try { const s = localStorage.getItem("malspiel-sec"); if (s) slider.value = s; } catch (e) {}
$("secLabel").textContent = slider.value;
slider.addEventListener("input", () => {
  $("secLabel").textContent = slider.value;
  try { localStorage.setItem("malspiel-sec", slider.value); } catch (e) {}
});

let audio, timer, raf, words = [], idx = 0, wakeLock = null;

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
}

["optOwn","optAdult"].forEach(id => {
  try { const v = localStorage.getItem("paint-" + id); if (v !== null) $(id).checked = v === "1"; } catch (e) {}
  $(id).addEventListener("change", () => { try { localStorage.setItem("paint-" + id, $(id).checked ? "1" : "0"); } catch (e) {} });
});

function pickWords() {
  let pool = Object.values(BASE).flat();
  if ($("optOwn").checked) pool = pool.concat(OWN);
  if ($("optAdult").checked) pool = pool.concat(ADULT);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, ROUND);
}

function beep(freq = 880, dur = 0.18, when = 0) {
  if (!audio) return;
  const t = audio.currentTime + when;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function tick() {
  if (!audio) return;
  const t = audio.currentTime;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = "square"; o.frequency.value = 330;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.25, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  o.connect(g).connect(audio.destination);
  o.start(t); o.stop(t + 0.1);
}

async function keepAwake() {
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
function releaseAwake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }

function showWord() {
  const ms = Number(slider.value) * 1000;
  $("word").classList.remove("count");
  $("word").textContent = words[idx];
  $("counter").textContent = (idx + 1) + " / " + ROUND;
  beep(idx === 0 ? 660 : 880);
  const t0 = performance.now();
  cancelAnimationFrame(raf);
  const tick = now => {
    $("bar").style.width = Math.min(100, (now - t0) / ms * 100) + "%";
    if (now - t0 < ms) raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  timer = setTimeout(() => {
    idx++;
    if (idx < ROUND) showWord(); else finish();
  }, ms);
}

function startRound() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === "suspended") audio.resume();
  words = pickWords(); idx = 0;
  keepAwake();
  show("play");
  countdown(3);
}

function countdown(n) {
  $("bar").style.width = "0";
  $("counter").textContent = "Gleich geht's los";
  $("word").classList.add("count");
  $("word").textContent = n;
  tick();
  timer = setTimeout(() => n > 1 ? countdown(n - 1) : showWord(), 1000);
}

function stopRound() {
  clearTimeout(timer); cancelAnimationFrame(raf); releaseAwake();
}

function finish() {
  stopRound();
  beep(660, 0.15); beep(880, 0.15, 0.17); beep(1100, 0.3, 0.34);
  $("list").innerHTML = "";
  words.forEach(w => { const li = document.createElement("li"); li.textContent = w; li.onclick = () => li.classList.toggle("done"); $("list").appendChild(li); });
  show("end");
}

$("startBtn").onclick = startRound;
$("nextBtn").onclick = startRound;
$("homeBtn").onclick = () => { show("start"); $("settings").open = true; };
$("stop").onclick = () => { stopRound(); show("start"); };
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && $("play").classList.contains("active")) keepAwake();
});
